<!doctype html><meta charset="utf-8"><title>Garden outline options (same leaf density)</title>
<style>body{margin:0;background:#fff;font:14px system-ui;padding:20px}h1{font-size:15px;margin:0 0 14px;font-weight:600}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.c{text-decoration:none;color:#222}
.f{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border:1px solid #ddd;border-radius:8px}
iframe{position:absolute;left:0;top:0;width:1200px;height:800px;border:0;transform-origin:0 0;pointer-events:none}
span{display:block;margin-top:6px;font-weight:600}</style>
<h1>Garden outline options (same leaf density). Click one to open it full size (each takes a few seconds to settle).</h1><div class="g"><a class="c" href="season.html?shape=0&v=130" target="_blank"><div class="f"><iframe src="season.html?shape=0&v=130" tabindex="-1"></iframe></div><span>0 · current</span></a><a class="c" href="season.html?shape=1&v=130" target="_blank"><div class="f"><iframe src="season.html?shape=1&v=130" tabindex="-1"></iframe></div><span>1 · calm oval</span></a><a class="c" href="season.html?shape=2&v=130" target="_blank"><div class="f"><iframe src="season.html?shape=2&v=130" tabindex="-1"></iframe></div><span>2 · big core, few tufts</span></a><a class="c" href="season.html?shape=3&v=130" target="_blank"><div class="f"><iframe src="season.html?shape=3&v=130" tabindex="-1"></iframe></div><span>3 · soft & wide-spread</span></a><a class="c" href="season.html?shape=4&v=130" target="_blank"><div class="f"><iframe src="season.html?shape=4&v=130" tabindex="-1"></iframe></div><span>4 · wide low band</span></a></div>
<script>function fit(){document.querySelectorAll('.f').forEach(f=>{f.firstChild.style.transform='scale('+f.clientWidth/1200+')'})}fit();addEventListener('resize',fit)</script>
